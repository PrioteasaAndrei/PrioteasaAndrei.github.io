# this file uses prebuilt image in dockerhub
version: '3'

services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - /srv/jekyll/vendor
      - /srv/jekyll/.bundle
    environment:
      - JEKYLL_ENV=development
