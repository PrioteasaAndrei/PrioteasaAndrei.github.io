# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:latest
    build: .
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development

  backend:
    build: .
    container_name: flask-backend
    ports:
      - 5001:5000
    volumes:
      - ./backend:/srv/backend
    environment:
      - FLASK_ENV=development
    # command: flask run --host=0.0.0.0 --port=5000